<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>ملهم طباعة</title>
<style>
:root{--bg:#f4f5f0;--card:#fff;--ink:#141414;--mute:#6b6f66;--lime:#8cc63f;--lime-s:#e6f2d2;--line:#e4e6dd;--red:#d64545}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo","Segoe UI",Tahoma,sans-serif;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.brand{font-weight:900;font-size:26px;display:flex;align-items:center;gap:10px}
.brand svg{width:46px;height:46px}
nav{display:flex;gap:4px;background:var(--ink);padding:5px;border-radius:999px}
nav button{border:0;background:transparent;color:var(--bg);font:700 14px inherit;font-family:inherit;padding:8px 16px;border-radius:999px;cursor:pointer}
nav button.on{background:var(--lime);color:#141414}
h2{font-size:19px;margin:0 0 12px;font-weight:900}
.card{background:var(--card);border-radius:22px;padding:18px;border:1px solid var(--line);box-shadow:0 2px 0 var(--line);margin-bottom:14px}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;align-items:start}
@media(max-width:860px){.two{grid-template-columns:1fr}}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
label.f{font-size:12px;font-weight:700;color:var(--mute);display:block;margin-bottom:3px}
input,select{width:100%;font:700 15px inherit;font-family:inherit;padding:10px 11px;border-radius:13px;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
input[type=checkbox]{width:20px;height:20px;accent-color:#8cc63f;padding:0}
.ck{display:flex;align-items:center;gap:8px;font-weight:700;padding:8px 0;cursor:pointer}
.btn{border:0;font:900 15px inherit;font-family:inherit;padding:11px 20px;border-radius:999px;background:var(--ink);color:var(--lime);cursor:pointer}
.btn.lime{background:var(--lime);color:#141414}.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}.btn.sm{padding:6px 13px;font-size:13px}.btn.red{background:transparent;color:var(--red);border:1.5px solid var(--red)}
.mute{color:var(--mute);font-size:13px}
.file{display:flex;justify-content:space-between;gap:10px;background:var(--lime-s);padding:10px 14px;border-radius:14px;margin-top:12px;font-weight:700}
#drop.over{outline:3px dashed var(--lime)}
.chips{display:grid;gap:8px;margin-bottom:12px}
.chip{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:16px;padding:10px 12px;cursor:pointer;font-weight:700}
.chip.on{border-color:var(--lime);background:var(--lime-s)}.chip span{flex:1}.chip b{font-size:22px}
.sum{background:var(--ink);color:#f4f5f0;border-radius:18px;padding:14px;margin-bottom:12px}
.sum div{display:flex;justify-content:space-between;padding:3px 0;color:#b9beb0}.sum b{color:var(--lime)}
.sum .t{font-size:20px;color:#fff;border-top:1px solid #3a3e35;margin-top:6px;padding-top:8px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.job{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.tag{background:var(--lime-s);padding:3px 11px;border-radius:999px;font-size:12px;font-weight:700}
.tag.printing{background:#ffe9a8}.tag.failed{background:#ffd6d6}.tag.cancelled,.tag.done{background:#e9eae4}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.m{background:var(--bg);border-radius:16px;padding:14px;border:1px solid var(--line)}.m .n{font-size:32px;font-weight:900;line-height:1.2}
.hero{background:var(--ink);color:#f4f5f0;display:flex;gap:20px;flex-wrap:wrap;align-items:center}.hero .big{font-size:48px;font-weight:900;color:var(--lime);line-height:1}
.row{display:grid;grid-template-columns:2fr 1fr 1fr auto auto auto;gap:8px;align-items:center;margin-bottom:8px}
.empty{color:var(--mute);text-align:center;padding:20px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--lime);padding:12px 22px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s}.toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand">
    <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="6" y="26" width="40" height="22" rx="6" fill="#141414"/><rect x="13" y="12" width="26" height="18" rx="3" fill="#fff" stroke="#141414" stroke-width="3"/><rect x="13" y="44" width="26" height="9" rx="2" fill="#fff" stroke="#141414" stroke-width="3"/><circle cx="38" cy="35" r="2.5" fill="#8cc63f"/><path d="M33 34v24l6-6 5 10 4-2-5-10h8z" fill="#8cc63f" stroke="#141414" stroke-width="2.5" stroke-linejoin="round"/><path d="M50 28l5-4M53 35h7M45 25l1-6" stroke="#8cc63f" stroke-width="3" stroke-linecap="round"/></svg>
    ملهم طباعة
  </div>
  <nav id="nav"></nav>
</header>
<main id="app"></main>
</div>
<div class="toast" id="toast"></div>
<script src="shared.js"></script>
<script>
let S, tab='new', form, editing=null, printers=[], range='today';
const $=s=>document.querySelector(s), AR=n=>Number(n||0).toLocaleString('ar-EG',{maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9), save=()=>api.set(S);
const SIZES=['A3','A4','A5','A6','A3+'];
const LAY={normal:'عادي',nup2:'صفحتين في الوش',nup4:'٤ صفحات في الوش',booklet:'بوكلت (كتيب)'};
const PER={normal:1,nup2:2,nup4:4,booklet:2};
const DEF={machines:[],papers:[{id:'p1',name:'ورق عادي',single:0.5,duplex:0.9},{id:'p2',name:'ورق جلوسي',single:0,duplex:0},{id:'p3',name:'ورق استيكر',single:0,duplex:0},{id:'p4',name:'ورق كوشيه',single:0,duplex:0}],factors:{A3:2,A4:1,A5:0.5,A6:0.25,'A3+':2.5},driverSize:{},queue:[],pinned:[],history:[]};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)}
const blank=()=>({file:null,range:'',copies:1,paper:S.papers[0].id,size:'A4',layout:'normal',duplex:true,color:false,rtl:true,note:'',machines:S.machines.filter(m=>m.active).map(m=>m.id)});
const day0=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()};
function calc(j){
  const n=j.file?rng(j.range,j.file.pages).length:0, dup=j.duplex||j.layout==='booklet';
  const pad=j.layout==='booklet'?Math.ceil(n/4)*4:n, faces=Math.ceil(pad/PER[j.layout]), sheets=Math.ceil(faces/(dup?2:1));
  const p=S.papers.find(x=>x.id===j.paper)||{single:0,duplex:0}, unit=(dup?p.duplex:p.single)*(S.factors[j.size]||1);
  return{n,sheets,unit,perCopy:sheets*unit,total:sheets*unit*j.copies,all:sheets*j.copies,dup};
}
const alloc=j=>dist(j.copies,S.machines.filter(m=>m.active&&j.machines.includes(m.id)));
const pname=id=>S.papers.find(p=>p.id===id)?.name||'—';
const desc=j=>`${j.size} · ${pname(j.paper)} · ${LAY[j.layout]} · ${calc(j).dup?'وش وضهر':'وش واحد'} · ${j.color?'ألوان':'أبيض وأسود'}`;

/* ---------- new job ---------- */
function newTab(){
  const f=form, sel=(k,arr)=>arr.map(([v,t])=>`<option value="${v}" ${f[k]===v?'selected':''}>${esc(t)}</option>`).join('');
  return `<div class="two"><section class="card" id="drop">
    <h2>${editing?'تعديل أمر طباعة':'ملف جديد'}</h2>
    <button class="btn lime" onclick="pickFile()">اختار ملف أو صورة</button> <span class="mute">أو اسحبه وارميه هنا · PDF و JPG و PNG</span>
    ${f.file?`<div class="file"><span>${esc(f.file.name)}</span><span>${AR(f.file.pages)} صفحة</span></div>`:''}
    <div class="g">
      <div><label class="f">نطاق الصفحات (فاضي = الكل)</label><input value="${esc(f.range)}" placeholder="مثال: 1-10, 15" oninput="upd('range',this.value)"></div>
      <div><label class="f">عدد النسخ</label><input type="number" min="1" value="${f.copies}" oninput="upd('copies',Math.max(1,parseInt(this.value)||1))"></div>
      <div><label class="f">نوع الورق</label><select onchange="upd('paper',this.value,1)">${sel('paper',S.papers.map(p=>[p.id,p.name]))}</select></div>
      <div><label class="f">مقاس الورق</label><select onchange="upd('size',this.value,1)">${sel('size',SIZES.map(s=>[s,s]))}</select></div>
      <div><label class="f">طريقة الصفحات</label><select onchange="upd('layout',this.value,1)">${sel('layout',Object.entries(LAY))}</select></div>
      <div><label class="f">ملاحظة / اسم الطالب</label><input value="${esc(f.note)}" oninput="upd('note',this.value,0,1)"></div>
    </div>
    <label class="ck"><input type="checkbox" ${f.duplex||f.layout==='booklet'?'checked':''} ${f.layout==='booklet'?'disabled':''} onchange="upd('duplex',this.checked,1)"> وش وضهر</label>
    <label class="ck"><input type="checkbox" ${f.color?'checked':''} onchange="upd('color',this.checked,1)"> طباعة ملونة</label>
    <label class="ck"><input type="checkbox" ${f.rtl?'checked':''} onchange="upd('rtl',this.checked,1)"> ترتيب عربي (الصفحة الأولى يمين)</label>
  </section>
  <section class="card" id="side">${side()}</section></div>`;
}
function side(){
  const f=form, c=calc(f), al=alloc(f), ms=S.machines.filter(m=>m.active), p=S.papers.find(x=>x.id===f.paper);
  return `<h2>الماكينات</h2>`+(ms.length?`<div class="chips">${S.machines.map((m,i)=>{if(!m.active)return'';const on=f.machines.includes(m.id);
    return `<label class="chip ${on?'on':''}"><input type="checkbox" ${on?'checked':''} onchange="togM(${i})"><span>${esc(m.label)}</span><b>${on?AR(al[m.id]||0):'—'}</b></label>`}).join('')}</div>`
    :`<div class="empty">مفيش ماكينات متضافة.<br>روح «الإعدادات» واضغط «اكتشاف الطابعات».</div>`)+
  `<div class="sum"><div>صفحات الملف<b>${AR(c.n)}</b></div><div>ورق للنسخة الواحدة<b>${AR(c.sheets)}</b></div><div>إجمالي الورق<b>${AR(c.all)}</b></div>
   ${c.unit?`<div>تكلفة النسخة<b>${AR(c.perCopy)} ج</b></div><div class="t">الإجمالي<b>${AR(c.total)} ج</b></div>`:`<div class="t">التكلفة<b>سعر ${esc(p?.name||'')} ${f.size} غير محدد</b></div>`}</div>
   <div class="acts">${editing?`<button class="btn" onclick="submit(0)">حفظ التعديل</button><button class="btn ghost" onclick="cancelEdit()">إلغاء</button>`
   :`<button class="btn lime" onclick="submit(1)">اطبع الآن</button><button class="btn" onclick="submit(0)">أضف للطابور</button><button class="btn ghost" onclick="pin()">ثبّت الملف</button>`}</div>`;
}
function upd(k,v,full,quiet){form[k]=v;if(k==='layout'&&v==='booklet')form.duplex=true;full?render():quiet||($('#side').innerHTML=side())}
function togM(i){const id=S.machines[i].id,a=form.machines,x=a.indexOf(id);x<0?a.push(id):a.splice(x,1);$('#side').innerHTML=side()}
async function pickFile(){loadFiles(await api.pick())}
async function loadFiles(ps){
  if(!ps.length)return;
  const fs=[];for(const p of ps)fs.push(await api.info(p));
  form.file=fs[0];
  fs.slice(1).forEach(x=>S.queue.push({...form,file:x,machines:[...form.machines],id:uid(),status:'waiting',ts:Date.now()}));
  if(fs.length>1){save();toast(`اتضاف ${AR(fs.length-1)} ملف للطابور بنفس الإعدادات`)}
  render();
}
function valid(){const f=form;if(!f.file)return'اختار ملف الأول';if(!f.copies)return'اكتب عدد النسخ';if(!f.machines.some(id=>S.machines.find(m=>m.id===id&&m.active)))return'اختار ماكينة واحدة على الأقل';return''}
function submit(run){
  const e=valid();if(e)return toast(e);
  const j={...form,machines:[...form.machines],id:editing||uid(),status:'waiting',ts:Date.now()};
  if(editing){const i=S.queue.findIndex(x=>x.id===editing);i<0?S.queue.push(j):S.queue[i]=j;editing=null}else S.queue.push(j);
  form=blank();save();
  if(run){tab='queue';render();runJob(j.id)}else{toast('اتحفظ في الطابور');render()}
}
function cancelEdit(){editing=null;form=blank();render()}
function pin(){const e=valid();if(e)return toast(e);S.pinned.push({...form,machines:[...form.machines],id:uid()});save();toast('الملف اتثبت')}

/* ---------- queue ---------- */
async function runJob(id){
  const j=S.queue.find(x=>x.id===id);if(!j||j.status==='printing')return;
  const al=alloc(j);if(!Object.values(al).some(v=>v>0)){j.status='failed';j.err='مفيش ماكينة شغالة مختارة';render();return}
  j.status='printing';j.err='';j.alloc=al;render();
  const r=await api.run({...j,alloc:al,driverSize:S.driverSize[j.size]||(j.size==='A3+'?'':j.size)});
  if(r.ok){const c=calc(j);j.status='done';S.history.push({ts:Date.now(),name:j.file.name,path:j.file.path,paper:j.paper,size:j.size,copies:j.copies,sheets:c.all,per:c.sheets,cost:c.total,alloc:al})}
  else{j.status='failed';j.err=r.error}
  save();render();
}
async function runAll(){for(const j of S.queue.filter(x=>x.status==='waiting'))await runJob(j.id)}
function edit(id){const j=S.queue.find(x=>x.id===id);form={...j,machines:[...j.machines]};editing=id;tab='new';render()}
function setSt(id,s){S.queue.find(x=>x.id===id).status=s;save();render()}
function del(id){S.queue=S.queue.filter(x=>x.id!==id);save();render()}
function dup(id){const j=S.queue.find(x=>x.id===id);S.queue.push({...j,id:uid(),status:'waiting',err:'',ts:Date.now()});save();render()}
const ST={waiting:'مستني',printing:'بيطبع…',done:'تمت',failed:'فشلت',cancelled:'ملغية'};
function queueTab(){
  const w=S.queue.filter(j=>j.status==='waiting').length;
  return `<section class="card"><div style="display:flex;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap"><h2 style="margin:0">أوامر الطباعة</h2>
   <span>${w?`<button class="btn lime" onclick="runAll()">اطبع كل المستني (${AR(w)})</button> `:''}${S.queue.some(j=>['done','cancelled'].includes(j.status))?`<button class="btn ghost sm" onclick="clearDone()">امسح المنتهي</button>`:''}</span></div>
  ${S.queue.length?[...S.queue].reverse().map(j=>{const c=calc(j),al=j.alloc&&j.status!=='waiting'?j.alloc:alloc(j),s=j.status;
   return `<div class="job"><div><b>${esc(j.file.name)}</b> <span class="tag ${s}">${ST[s]}</span>${j.note?` <span class="mute">· ${esc(j.note)}</span>`:''}
    <div class="mute">${esc(desc(j))} · ${AR(j.copies)} نسخة · ${AR(c.all)} ورقة${c.unit?` · ${AR(c.total)} ج`:''}</div>
    <div class="mute">${Object.entries(al).filter(([,v])=>v).map(([k,v])=>`${esc(S.machines.find(m=>m.id===k)?.label||'؟')}: ${AR(v)}`).join(' | ')}${j.err?` <span style="color:var(--red)">· ${esc(j.err)}</span>`:''}</div></div>
    <div class="acts">${s==='waiting'||s==='failed'?`<button class="btn sm lime" onclick="runJob('${j.id}')">${s==='failed'?'جرّب تاني':'اطبع'}</button><button class="btn sm ghost" onclick="edit('${j.id}')">تعديل</button><button class="btn sm red" onclick="${s==='waiting'?`setSt('${j.id}','cancelled')`:`del('${j.id}')`}">${s==='waiting'?'إلغاء':'حذف'}</button>`
     :s==='printing'?'<span class="mute">الأمر اتبعت للطابعات</span>':`<button class="btn sm ghost" onclick="dup('${j.id}')">تكرار</button><button class="btn sm red" onclick="del('${j.id}')">حذف</button>`}</div></div>`}).join(''):'<div class="empty">الطابور فاضي. ابدأ من «ملف جديد».</div>'}</section>`;
}
function clearDone(){S.queue=S.queue.filter(j=>!['done','cancelled'].includes(j.status));save();render()}

/* ---------- pinned ---------- */
function pinnedTab(){
  return `<section class="card"><h2>الملفات الثابتة</h2><p class="mute" style="margin-top:-6px">الملفات اللي بتتطبع كل يوم. الإعدادات متحفوظة، اكتب عدد النسخ واطبع.</p>
  <div class="grid">${S.pinned.map((p,i)=>{const t=S.history.filter(h=>h.path===p.file.path&&h.ts>=day0()).reduce((a,h)=>a+h.copies,0);
   return `<div class="m"><b>${esc(p.file.name)}</b><div class="mute">${esc(desc(p))}</div><div class="n">${AR(t)}</div><div class="mute">اتطبع النهاردة</div>
   <div style="display:flex;gap:6px;margin:10px 0"><input id="pc${i}" type="number" min="1" value="1"><button class="btn sm lime" onclick="pinPrint(${i},1)">اطبع</button></div>
   <div class="acts"><button class="btn sm ghost" onclick="pinPrint(${i},0)">للطابور</button><button class="btn sm red" onclick="S.pinned.splice(${i},1);save();render()">إزالة</button></div></div>`}).join('')||'<div class="empty">مفيش ملفات متثبتة. جهّز ملف في «ملف جديد» واضغط «ثبّت الملف».</div>'}</div></section>`;
}
function pinPrint(i,run){
  const p=S.pinned[i],c=Math.max(1,parseInt($('#pc'+i).value)||1),j={...p,copies:c,machines:[...p.machines],id:uid(),status:'waiting',ts:Date.now()};
  S.queue.push(j);save();if(run){tab='queue';render();runJob(j.id)}else{toast('اتضاف للطابور');render()}
}

/* ---------- stats ---------- */
function statsTab(){
  const H=S.history.filter(h=>range==='all'||h.ts>=day0()),byM={},byP={};let sh=0,cp=0,cost=0;
  H.forEach(h=>{sh+=h.sheets;cp+=h.copies;cost+=h.cost;byP[h.paper]=(byP[h.paper]||0)+h.sheets;Object.entries(h.alloc).forEach(([k,v])=>{const o=byM[k]||(byM[k]={c:0,s:0});o.c+=v;o.s+=v*h.per})});
  return `<section class="card hero"><div><div class="mute">إجمالي الورق ${range==='today'?'النهاردة':'من البداية'}</div><div class="big">${AR(sh)}</div><div class="mute">ورقة · ${AR(cp)} نسخة · ${AR(H.length)} أمر</div></div>
   <div><div class="mute">التكلفة</div><div class="big">${AR(cost)}</div><div class="mute">جنيه</div></div>
   <div style="margin-inline-start:auto" class="acts"><button class="btn sm ${range==='today'?'lime':'ghost'}" onclick="range='today';render()">اليوم</button><button class="btn sm ${range==='all'?'lime':'ghost'}" onclick="range='all';render()">الكل</button></div></section>
  <section class="card"><h2>كل ماكينة طبعت كام</h2><div class="grid">${S.machines.map(m=>`<div class="m"><b>${esc(m.label)}</b><div class="n">${AR(byM[m.id]?.s)}</div><div class="mute">ورقة · ${AR(byM[m.id]?.c)} نسخة</div></div>`).join('')||'<div class="empty">لسه مفيش ماكينات.</div>'}</div></section>
  <section class="card"><h2>حسب نوع الورق (ورقة)</h2><div class="grid">${S.papers.map(p=>`<div class="m"><b>${esc(p.name)}</b><div class="n">${AR(byP[p.id])}</div></div>`).join('')}</div></section>`;
}

/* ---------- settings ---------- */
async function detect(){try{printers=await api.printers();toast(`لقيت ${AR(printers.length)} طابعة`)}catch(e){toast('مقدرتش أقرأ الطابعات')}render()}
function addPr(n){S.machines.push({id:n,label:'ماكينة '+AR(S.machines.length+1),weight:1,active:true});save();render()}
async function testPr(i){const m=S.machines[i],r=await api.test({name:m.id,label:'MACHINE '+(i+1)});toast(r.ok?`اتبعتت صفحة تعريف: لما تخرج من أي ماكينة تبقى ${m.label}`:'فشل: '+r.error)}
const upM=(i,k,v)=>{S.machines[i][k]=k==='weight'?(+v||1):v;save();k==='active'&&render()};
const upP=(i,k,v)=>{S.papers[i][k]=k==='name'?v:(+v||0);save()};
function settingsTab(){
  const free=printers.filter(p=>!S.machines.some(m=>m.id===p.name));
  return `<section class="card"><h2>الماكينات</h2>
   <p class="mute" style="margin-top:-6px">اضغط «اكتشاف» والبرنامج هيقرا كل الطابعات الموصلة بالجهاز. سمّي كل واحدة، وزر «صفحة تعريف» بيطبع على الماكينة رقمها عشان تعرفها بإيدك.</p>
   <button class="btn lime" onclick="detect()">اكتشاف الطابعات</button>
   ${free.length?`<div style="margin:12px 0">${free.map(p=>`<div class="row" style="grid-template-columns:1fr auto"><span>${esc(p.name)}</span><button class="btn sm" onclick="addPr(${JSON.stringify(p.name).replace(/"/g,'&quot;')})">ضيف</button></div>`).join('')}</div>`:''}
   <div style="margin-top:14px">${S.machines.map((m,i)=>`<div class="row"><input value="${esc(m.label)}" onchange="upM(${i},'label',this.value)"><input type="number" min="0.5" step="0.5" value="${m.weight}" title="السرعة النسبية" onchange="upM(${i},'weight',this.value)"><label class="ck"><input type="checkbox" ${m.active?'checked':''} onchange="upM(${i},'active',this.checked)">شغالة</label><button class="btn sm ghost" onclick="testPr(${i})">صفحة تعريف</button><button class="btn sm red" onclick="S.machines.splice(${i},1);save();render()">حذف</button><span class="mute" style="grid-column:1/-1;margin-top:-4px">${esc(m.id)}</span></div>`).join('')}</div>
   <p class="mute">الرقم التاني = السرعة النسبية. اللي سرعتها ٢ بتاخد ضعف نسخ اللي سرعتها ١.</p></section>
  <section class="card"><h2>سعر الورقة (مقاس A4)</h2>
   <div class="row" style="grid-template-columns:2fr 1fr 1fr" ><span class="mute">النوع</span><span class="mute">وش واحد</span><span class="mute">وش وضهر</span></div>
   ${S.papers.map((p,i)=>`<div class="row" style="grid-template-columns:2fr 1fr 1fr"><input value="${esc(p.name)}" onchange="upP(${i},'name',this.value)"><input type="number" step="0.05" min="0" value="${p.single}" onchange="upP(${i},'single',this.value)"><input type="number" step="0.05" min="0" value="${p.duplex}" onchange="upP(${i},'duplex',this.value)"></div>`).join('')}
   <button class="btn sm lime" onclick="S.papers.push({id:uid(),name:'نوع جديد',single:0,duplex:0});save();render()">+ نوع ورق</button>
   <h2 style="margin-top:20px">معامل المقاس (نسبة من A4)</h2><div class="g">${SIZES.map(s=>`<div><label class="f">${s}</label><input type="number" step="0.05" min="0" value="${S.factors[s]}" onchange="S.factors['${s}']=+this.value||0;save()"></div>`).join('')}</div></section>
  <section class="card"><h2>اسم المقاس عند تعريف الطابعة</h2><p class="mute" style="margin-top:-6px">لو الطابعة بتسمي المقاس بشكل مختلف (مثلاً A3+ عندها «Super B»)، اكتب الاسم زي ما هو في إعدادات الطابعة. سيبه فاضي لو مش لازم.</p>
   <div class="g">${['A3+','A3','A5','A6'].map(s=>`<div><label class="f">${s}</label><input value="${esc(S.driverSize[s]||'')}" onchange="S.driverSize['${s}']=this.value.trim();save()"></div>`).join('')}</div></section>`;
}

/* ---------- shell ---------- */
function render(){
  const w=S.queue.filter(j=>j.status==='waiting'||j.status==='printing').length;
  $('#nav').innerHTML=[['new','ملف جديد'],['queue','الطابور'+(w?` (${AR(w)})`:'')],['pinned','الثابتة'],['stats','الإحصائيات'],['set','الإعدادات']].map(([k,v])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render()">${v}</button>`).join('');
  $('#app').innerHTML={new:newTab,queue:queueTab,pinned:pinnedTab,stats:statsTab,set:settingsTab}[tab]();
}
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{e.preventDefault();loadFiles([...e.dataTransfer.files].map(f=>api.pathOf(f)).filter(p=>/\.(pdf|jpe?g|png)$/i.test(p)));tab='new'});
(async()=>{S=Object.assign({},DEF,await api.get()||{});S.queue.forEach(j=>{if(j.status==='printing')j.status='failed'});form=blank();render()})();
</script>
</body>
</html>
